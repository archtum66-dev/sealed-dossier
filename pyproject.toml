[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sealed-dossier"
version = "0.1.0"
description = "Ask questions about a local dossier on a private AI (NEAR AI Cloud, TEE), with names replaced before anything leaves the machine and a verifiable receipt for every answer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sealed = "sealed.cli:main"

[tool.setuptools]
packages = ["sealed"]

[tool.setuptools.package-data]
sealed = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
